<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNQ Contract Sizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0f12;
    color: #e8eaed;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: #161a20;
    border: 1px solid #2a2f38;
    border-radius: 10px;
    padding: 28px 22px;
    width: 100%;
    max-width: 440px;
  }

  .eyebrow { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #5a6478; margin-bottom: 4px; }

  h1 { font-size: 18px; font-weight: 600; color: #c9d1e0; letter-spacing: -0.02em; margin-bottom: 24px; }

  hr { border: none; border-top: 1px solid #2a2f38; margin: 4px 0 18px; }

  /* ── Field rows ─────────────────────────────── */
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }

  .field-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5a6478; }
